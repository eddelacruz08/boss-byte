# BossByte local stack.
#
#   npm run docker:up                      backing services only (the normal dev setup)
#   docker compose --profile app up -d     ...plus the production images of the API,
#                                          worker and dashboard (http://localhost:8080)
#
# Everything here is for local development: the credentials are well-known
# defaults and must never be reused in a hosted environment.
#
# Host ports can be moved without editing this file — set the variables below
# in a root `.env` (see `.env.example`), e.g. `MINIO_PORT=9100`.

name: bossbyte

# Settings the production images need to reach the services by their compose
# hostnames. They override the localhost values in apps/api/.env.
x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  LOG_LEVEL: info
  # The dashboard container (Nginx) is the one proxy in front of the API.
  TRUST_PROXY: 1
  APP_URL: http://localhost:${CORE_PORT:-8080}
  DATABASE_URL: postgres://bossbyte:bossbyte@postgres:5432/bossbyte
  REDIS_URL: redis://redis:6379
  JWT_PRIVATE_KEY_PATH: /run/bossbyte/keys/jwt-private.pem
  JWT_PUBLIC_KEY_PATH: /run/bossbyte/keys/jwt-public.pem
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  # Signed download URLs are opened by the browser, which cannot resolve "minio".
  S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
  S3_BUCKET: bossbyte
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: mailpit
  SMTP_PORT: 1025

x-api-service: &api-service
  image: bossbyte-api:local
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  profiles: [app]
  init: true
  # Longer than the 25 seconds the API and worker give themselves to finish
  # work on SIGTERM. Docker's default is 10.
  stop_grace_period: 30s
  # Secrets generated by `npm run setup` (CSRF_SECRET, DATA_ENCRYPTION_KEY, …).
  env_file:
    - path: apps/api/.env
      required: false
  environment: *api-environment
  volumes:
    # The JWT key pair from `npm run setup`. On Linux the private key (mode 600)
    # must be readable by uid 1000, the user the container runs as.
    - ./apps/api/keys:/run/bossbyte/keys:ro

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bossbyte
      POSTGRES_PASSWORD: bossbyte
      POSTGRES_DB: bossbyte
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bossbyte -d bossbyte']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bull keeps jobs in Redis, so persist them and never evict keys.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing images to Docker Hub; these are Chainguard's builds
    # of the same open-source server. The -dev tag carries the shell and `mc`
    # that the health check and the init step below rely on.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest-dev}
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${MINIO_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: creates the bucket the API expects, then exits.
  minio-init:
    image: ${MINIO_MC_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev}
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/bossbyte
        echo "Bucket 'bossbyte' is ready."

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '${MAILPIT_UI_PORT:-8025}:8025' # web inbox
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # pgAdmin rejects reserved TLDs such as ".local" for the login email.
      PGADMIN_DEFAULT_EMAIL: admin@bossbyte.dev
      PGADMIN_DEFAULT_PASSWORD: bossbyte
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    configs:
      # Pre-registers the "BossByte (local)" server, password included.
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
      - source: pgadmin-pgpass
        target: /pgadmin4/pgpass
        uid: '5050'
        gid: '0'
        mode: 0600
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:80/misc/ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─── Production images (opt-in: --profile app) ──────────────────────────────

  # One-shot: applies pending SQL migrations before the API starts.
  migrate:
    <<: *api-service
    restart: 'no'
    command: ['node', 'dist/migrate.js']
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-service
    restart: unless-stopped
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *api-service
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-environment
      WORKER_HEALTH_PORT: 4001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  core:
    image: bossbyte-core:local
    build:
      context: .
      dockerfile: docker/core.Dockerfile
      args:
        VITE_API_URL: /api/v1
    profiles: [app]
    restart: unless-stopped
    environment:
      PORT: 8080
      API_UPSTREAM: http://api:4000
    ports:
      - '${CORE_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "BossByte (local)",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "bossbyte",
            "Username": "bossbyte",
            "PassFile": "/pgadmin4/pgpass",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin-pgpass:
    content: |
      postgres:5432:*:bossbyte:bossbyte

volumes:
  postgres-data:
  redis-data:
  minio-data:
  pgadmin-data:
