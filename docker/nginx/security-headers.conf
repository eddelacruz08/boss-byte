# Included by every location that serves the dashboard. Nginx drops inherited
# `add_header` directives as soon as a location declares one of its own, so the
# full set lives here and is included wherever headers are added.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# same-origin-allow-popups (not same-origin) keeps Firebase popup sign-in working.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
add_header Content-Security-Policy $content_security_policy always;
# Empty unless the request arrived over HTTPS, in which case the header is sent.
add_header Strict-Transport-Security $hsts_header always;
