# How GitHub groups pull requests in generated release notes (used by the
# Release workflow). A pull request lands in the first category whose label it
# carries; unlabelled ones fall through to "Other changes".

changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking
    - title: 🔒 Security
      labels:
        - security
    - title: ✨ Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
