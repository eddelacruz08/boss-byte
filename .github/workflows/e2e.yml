name: E2E

# Playwright end-to-end tests against a real API, database and dashboard.
# Manual for now (Actions tab → E2E → Run workflow): add a `pull_request`
# trigger once the suite is stable enough to gate merges.
#
# The workflow provides the backing services and a seeded database; starting
# the API and the dashboard is left to the `webServer` setting in
# playwright.config.ts, so the same command works locally.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # File storage (MinIO) is not started: tests that upload files need it added here.
      - name: Start PostgreSQL, Redis and Mailpit
        run: docker compose up --detach --wait postgres redis mailpit

      - name: Create .env files and keys
        run: npm run setup

      - name: Migrate and seed the database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
