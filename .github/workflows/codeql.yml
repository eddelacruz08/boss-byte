name: CodeQL

# Static security analysis of the TypeScript and JavaScript sources. Findings
# appear under Security → Code scanning.
#
# Code scanning is free for public repositories; private repositories need
# GitHub Advanced Security (Code Security) enabled, otherwise the upload fails.

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # Mondays 03:17 UTC: catches new queries even when the code is quiet.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # No build step: CodeQL reads TypeScript sources directly.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
